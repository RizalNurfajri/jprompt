<svg width="200" height="150" viewBox="0 0 200 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="metal-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#cccccc;stop-opacity:1" />
      <stop offset="20%" style="stop-color:#eeeeee;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#bbbbbb;stop-opacity:1" />
      <stop offset="80%" style="stop-color:#dddddd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#999999;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="100" fill="url(#metal-grad)" filter="url(#shadow)" letter-spacing="-5">
    JP
  </text>
  
  <!-- Optional clean border -->
  <!-- <rect x="5" y="5" width="190" height="140" fill="none" stroke="url(#metal-grad)" stroke-width="5" rx="20" ry="20" /> -->
</svg>
